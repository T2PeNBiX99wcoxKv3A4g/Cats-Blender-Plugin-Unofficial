name: Site

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Site/**"
      - ".github/workflows/site.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    uses: T2PeNBiX99wcoxKv3A4g/Release-Workflows/.github/workflows/web_pages.yml@main
    with:
      working_directory: Site
      # The site shows each page's last commit date, so the history is needed.
      fetch_depth: 0
    secrets: inherit

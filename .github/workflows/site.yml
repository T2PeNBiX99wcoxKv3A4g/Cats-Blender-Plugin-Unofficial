name: Site

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      # The site lives in Site/; the favicon fallback is the add-on's own icon, so a change
      # to that rebuilds it too.
      - "Site/**"
      - "resources/icons/other/cats1.png"
      - ".github/workflows/site.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    uses: T2PeNBiX99wcoxKv3A4g/Release-Workflows/.github/workflows/vitepress_pages.yml@main
    with:
      working_directory: Site
    secrets: inherit

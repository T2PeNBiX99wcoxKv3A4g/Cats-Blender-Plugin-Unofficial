name: Build extension

# Builds the Blender extension ZIP. Tag pushes also publish it as a GitHub
# release, which is what the add-on's built-in updater reads.

on:
  push:
    tags: [ "[0-9]*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Blender is unpacked outside the checkout on purpose: anything inside
      # the workspace would be picked up as part of the extension payload.
      - name: Download Blender
        run: |
          mkdir -p "$RUNNER_TEMP/blender"
          curl -fsSL -o "$RUNNER_TEMP/blender.tar.xz" \
            https://download.blender.org/release/Blender5.3/blender-5.3.0-linux-x64.tar.xz
          tar -xf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP/blender"
          echo "BLENDER_BIN=$RUNNER_TEMP/blender/blender-5.3.0-linux-x64/blender" >> "$GITHUB_ENV"

      - name: Build extension
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          "$BLENDER_BIN" --command extension build \
            --source-dir "$GITHUB_WORKSPACE" \
            --output-dir "$RUNNER_TEMP/dist"
          ls -l "$RUNNER_TEMP/dist"

      - uses: actions/upload-artifact@v7
        with:
          name: cats-extension
          path: ${{ runner.temp }}/dist/*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ runner.temp }}/dist/*.zip
          fail_on_unmatched_files: true

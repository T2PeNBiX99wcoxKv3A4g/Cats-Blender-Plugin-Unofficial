<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="240" height="240">
  <title>Cats Blender Plugin</title>

  <!-- body: a rectangle with a semicircular head, ears standing on it -->
  <path fill="#fbbf24" d="M6 25.2
    V12.7
    A10 10 0 0 1 10 4.7
    V0.9
    L12.4 3.37
    A10 10 0 0 1 19.6 3.37
    L22 0.9
    V4.7
    A10 10 0 0 1 26 12.7
    V25.2
    Z"/>

  <!-- four legs, all inside the body -->
  <rect x="6" y="23.6" width="3" height="5.6" rx="1.2" fill="#fbbf24"/>
  <rect x="11" y="23.6" width="3" height="5.6" rx="1.2" fill="#fbbf24"/>
  <rect x="18" y="23.6" width="3" height="5.6" rx="1.2" fill="#fbbf24"/>
  <rect x="23" y="23.6" width="3" height="5.6" rx="1.2" fill="#fbbf24"/>

  <!-- tail -->
  <path fill="none" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round"
        d="M24.2 21.7C27.6 21.7 29.1 21 29.1 18.4V15.8"/>

  <!-- belly stripe -->
  <rect x="6" y="11.8" width="20" height="1.3" fill="#fef3c7"/>

  <!-- white socks: the source has them on the right pair only -->
  <rect x="18" y="27.2" width="3" height="2" rx="1.1" fill="#fef3c7"/>
  <rect x="23" y="27.2" width="3" height="2" rx="1.1" fill="#fef3c7"/>

  <!-- face -->
  <g fill="#1f2937">
    <rect x="12.4" y="6.4" width="1.9" height="2.7" rx="0.85"/>
    <rect x="17.7" y="6.4" width="1.9" height="2.7" rx="0.85"/>
    <rect x="14.9" y="9.1" width="2.2" height="1.4" rx="0.6"/>
  </g>
  <path fill="none" stroke="#1f2937" stroke-width="0.62" stroke-linecap="round"
        d="M13.5 10.6Q14.75 11.9 16 11Q17.25 11.9 18.5 10.6"/>
</svg>

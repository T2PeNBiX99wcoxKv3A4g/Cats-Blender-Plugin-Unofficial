schema_version = "1.0.0"

# Cats Blender Plugin Extension (unofficial community continuation)
id = "cats_blender_plugin_unofficial"
version = "5.7.0"
name = "Cats Blender Plugin (Unofficial)"
tagline = "Shorten the steps to import and optimize models for VRChat"
maintainer = "yukiyosanako"
type = "add-on"
website = "https://github.com/T2PeNBiX99wcoxKv3A4g/Cats-Blender-Plugin-Unofficial"
tags = ["3D View", "Modeling", "Mesh", "Object"]
blender_version_min = "4.2.0"
blender_version_max = "5.5.0"
license = [
  "SPDX:MIT",
]

# Bundled Python dependencies (packaged as wheels). Lifted out of the vendored
# MMD Tools extension by scripts/vendor_mmd_tools.py -- see that script when
# updating MMD Tools. Used by the bundled mmd_tools_local package.
wheels = [
  "./wheels/opencc_python_reimplemented-0.1.7-py2.py3-none-any.whl",
]

[permissions]
files = "Read and write Cats settings, translations and update files"
network = "Check for updates and download translations"

# The documentation site and the CI configuration live in the same repository but are
# not part of the add-on. A custom list replaces Blender's defaults, so the defaults
# (.git, __pycache__, ...) have to be repeated here.
[build]
paths_exclude_pattern = [
  "__pycache__/",
  "*.pyc",
  "/.git/",
  "/.gitignore",
  "/.github/",
  "/.idea/",
  "/Site/",
  ".yafm-index.db*",
  "/.version",
  "/.version_old",
]
